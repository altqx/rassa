[package]
name = "rassa-check"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Command-line visual checking tool for rassa subtitle rendering."
repository.workspace = true
readme.workspace = true
keywords.workspace = true

[dependencies]
# Keep the workspace's declared Rust 1.85 MSRV. image 0.25.10 raised its
# MSRV to 1.88, while 0.25.9 still supports 1.85.
image = { version = "=0.25.9", default-features = false, features = ["jpeg", "png"] }
rassa-core = { path = "../rassa-core", version = "0.7.0" }
rassa-fonts = { path = "../rassa-fonts", version = "0.7.0" }
rassa-parse = { path = "../rassa-parse", version = "0.7.0" }
rassa-render = { path = "../rassa-render", version = "0.7.0" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "rassa-check"
path = "src/main.rs"
