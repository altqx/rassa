[workspace]
members = [
	"crates/rassa-core",
	"crates/rassa-parse",
	"crates/rassa-unicode",
	"crates/rassa-fonts",
	"crates/rassa-shape",
	"crates/rassa-raster",
	"crates/rassa-layout",
	"crates/rassa-render",
	"crates/rassa",
	"crates/rassa-capi",
	"crates/rassa-libass-capi",
	"crates/rassa-check",
	"crates/rassa-test",
]
resolver = "2"

[workspace.package]
version = "0.7.1"
edition = "2024"
license = "MIT"
rust-version = "1.90"
repository = "https://github.com/altqx/rassa"
readme = "README.md"
keywords = ["subtitles", "ass", "renderer", "libass", "rust"]

[workspace.dependencies]
iconv-native = "0.1.0"
libc = "0.2"

# The distributed Rust facade and both C ABI shared libraries are latency-sensitive.
# Keep release builds portable, but let LLVM optimize across crate boundaries.
[profile.release]
lto = "thin"
codegen-units = 1
